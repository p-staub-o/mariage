<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Save the Date pour le mariage de Sofia et Philippe, le 19 juin 2027 à Montréal."
    />
    <title>Save the Date | Sofia & Philippe</title>
  </head>
  <body>
    <div id="save-date-root">
      <main
        aria-label="Save the Date"
        style="
          box-sizing: border-box;
          min-height: 100vh;
          display: grid;
          place-items: center;
          padding: 24px;
          color: #211a16;
          background: linear-gradient(145deg, #38422e 0%, #202b18 50%, #10170c 100%);
          font-family: Arial, Helvetica, sans-serif;
          text-align: center;
        "
      >
        <article
          style="
            box-sizing: border-box;
            width: min(620px, 100%);
            padding: 44px 24px;
            border: 1px solid rgba(111, 78, 46, 0.2);
            background: #fffaf0;
            box-shadow: 0 28px 56px rgba(0, 0, 0, 0.26);
          "
        >
          <p
            style="
              margin: 0 0 18px;
              color: #7a461f;
              font-size: 12px;
              font-weight: 800;
              text-transform: uppercase;
            "
          >
            Save the Date
          </p>
          <h1
            style="
              margin: 0;
              color: #1f2a18;
              font-family: Georgia, 'Times New Roman', serif;
              font-size: 34px;
              line-height: 1.15;
              font-weight: 400;
            "
          >
            Sofia &amp; Philippe
          </h1>
          <p
            style="
              margin: 22px 0 0;
              color: #7a461f;
              font-family: Georgia, 'Times New Roman', serif;
              font-size: 30px;
              line-height: 1;
              font-weight: 700;
            "
          >
            19 juin 2027
          </p>
          <p style="max-width: 430px; margin: 24px auto 0; color: #403630; font-size: 18px; line-height: 1.55;">
            La cérémonie aura lieu à 15 h à la Basilique Marie-Reine-du-Monde.
          </p>
          <p style="margin: 22px 0 0; color: #6b5d53; font-size: 15px; line-height: 1.55;">
            Invitation officielle et détails à venir.
          </p>
          <p style="margin: 28px 0 0;">
            <a
              href="/mariage/sofia-philippe-save-the-date.ics"
              style="
                display: inline-block;
                margin: 6px;
                border-radius: 999px;
                padding: 12px 18px;
                color: #fff8ea;
                background: #1f2a18;
                font-weight: 700;
                text-decoration: none;
              "
            >
              Ajouter au calendrier
            </a>
            <a
              href="https://maps.app.goo.gl/siPaPTSHrXeAVTsXA"
              style="
                display: inline-block;
                margin: 6px;
                border: 1px solid rgba(138, 90, 47, 0.26);
                border-radius: 999px;
                padding: 12px 18px;
                color: #1f2a18;
                font-weight: 700;
                text-decoration: none;
              "
            >
              Adresse
            </a>
          </p>
        </article>
      </main>
    </div>
    <script type="module" src="/src/save-the-date/main.tsx"></script>
  </body>
</html>
